[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "refall"
version = "1.0.10"
description = "A falling-block puzzle game across 61 hand-directed universes, staged by any music you like (local files or YouTube)"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Grégoire Passault" }]
keywords = ["puzzle", "falling blocks", "game", "music", "visualizer", "opengl"]
classifiers = [
    "Topic :: Games/Entertainment :: Puzzle Games",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Programming Language :: C++",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Environment :: X11 Applications",
]
dependencies = ["yt-dlp[default]", "imageio-ffmpeg"]

[project.urls]
Homepage = "https://github.com/Gregwar/refall"

[project.scripts]
refall = "refall._launcher:main"
refall-scope = "refall._launcher:scope"
refall-voyage-viewer = "refall._launcher:voyage_viewer"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.build-type = "Release"
wheel.packages = ["python/refall"]
# The package holds native executables, not Python extensions: one wheel per platform, any Python 3.
wheel.py-api = "py3"
sdist.exclude = ["audio", "build", "docs", ".github"]

[tool.scikit-build.cmake.define]
REFALL_BUNDLE_GLFW = "ON"

[tool.cibuildwheel]
build = "cp312-*"
skip = "*-musllinux_* *-win32 *_i686"
test-command = "refall --help"
build-verbosity = 1

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
before-all = "dnf install -y libX11-devel libXrandr-devel libXinerama-devel libXcursor-devel libXi-devel mesa-libGL-devel"
# The OpenGL libraries (libglvnd's dispatch, EGL, GLX) come from the system, never bundled: a bundled second copy of
# libGLdispatch crashes the game when the system's is loaded too (e.g. through an LD_PRELOAD).
repair-wheel-command = "auditwheel repair --exclude libEGL.so.1 --exclude libOpenGL.so.0 --exclude libGLdispatch.so.0 --exclude libGLX.so.0 --exclude libGL.so.1 -w {dest_dir} {wheel}"

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }

[tool.cibuildwheel.windows]
archs = ["AMD64"]
