# Release: push a tag vX.Y.Z (the version in pyproject.toml) and this builds the wheels for every platform and the
# sdist, publishes them to PyPI as `tetris-universe` (so `uvx tetris-universe` runs the game) and makes a GitHub
# release with the same files. Run it by hand (Actions > Release > Run workflow) to build without publishing.
#
# PyPI publishes through trusted publishing: on pypi.org, add a (pending) trusted publisher for the project
# `tetris-universe`: owner Gregwar, repository tetris-universe, workflow wheels.yml, environment pypi.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  check:
    name: Check the version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: The tag must match pyproject.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the version in pyproject.toml ($version)"
            exit 1
          fi

  wheels:
    name: Wheels (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04      # Linux x86_64
          - ubuntu-24.04-arm  # Linux aarch64
          - windows-2022      # Windows x86_64
          - macos-15-intel    # macOS x86_64
          - macos-15          # macOS arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheels
        run: |
          python -m pip install cibuildwheel
          python -m cibuildwheel --output-dir wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    name: Source distribution
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/tetris-universe/
    permissions:
      id-token: write  # trusted publishing: no API token needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Tetris Universe $GITHUB_REF_NAME" \
            --notes "Run it with \`uvx tetris-universe\` (or \`pipx install tetris-universe\`). https://pypi.org/project/tetris-universe/"
